<div class="container-fluid p-0">
    <!-- Header & Acciones Bootstrap -->
    <div class="card card-samgy p-4 mb-4">
        <div class="row align-items-center g-3">
            <div class="col-md-5">
                <h4 class="fw-bold text-dark font-title mb-1">Base de Datos — Mis Estudiantes</h4>
                <p class="text-muted small mb-0">Gestión, registro de nuevos alumnos y control sanitario</p>
            </div>
            <div class="col-md-7 d-flex flex-wrap justify-content-md-end align-items-center gap-2">
                <button class="btn btn-samgy btn-sm px-3 py-2" data-bs-toggle="modal" data-bs-target="#modalNuevoEstudiante">
                    <i class="bi bi-person-plus-fill me-1"></i>Añadir Estudiante
                </button>
                <div class="d-flex align-items-center gap-2">
                    <label for="grade-select" class="fw-bold small text-muted text-nowrap">Filtrar:</label>
                    <select id="grade-select" onchange="filterStudentsByGrade()" class="form-select form-select-sm w-auto fw-bold border-secondary-subtle">
                        <option value="TODOS">Todos los Cursos</option>
                        <option value="Grado 6°">Grado 6°</option>
                        <option value="Grado 7°">Grado 7°</option>
                        <option value="Grado 8°">Grado 8°</option>
                        <option value="Grado 9°">Grado 9°</option>
                        <option value="Grado 10°">Grado 10°</option>
                        <option value="Grado 11°">Grado 11°</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla Bootstrap -->
    <div class="card card-samgy shadow-sm">
        <div class="card-header bg-white py-3 d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
            <h5 class="fw-bold font-title mb-0 text-dark">Listado General de Alumnos Matriculados</h5>
            <div class="input-group input-group-sm w-100 w-sm-auto" style="max-width: 280px;">
                <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                <input type="text" id="search-student-input" onkeyup="searchStudents()" class="form-control" placeholder="Buscar por nombre o doc...">
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light text-uppercase small text-muted">
                    <tr>
                        <th>Estudiante</th>
                        <th>Documento</th>
                        <th>Curso</th>
                        <th>Alergias / Diagnóstico</th>
                        <th class="text-center">Visitas</th>
                        <th class="text-end">Acción</th>
                    </tr>
                </thead>
                <tbody id="students-table-body">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL BOOTSTRAP PARA AÑADIR NUEVO ESTUDIANTE -->
    <div class="modal fade" id="modalNuevoEstudiante" tabindex="-1" aria-labelledby="modalNuevoEstudianteLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-samgy-primary text-white">
                    <h5 class="modal-title font-title fw-bold" id="modalNuevoEstudianteLabel">
                        <i class="bi bi-person-plus me-2"></i>Registrar Nuevo Estudiante
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="form-nuevo-estudiante" onsubmit="handleCrearEstudiante(event)">
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Nombre Completo *</label>
                                <input type="text" id="add-nombre" required class="form-control form-control-sm" placeholder="Ej. Valentina Ríos Gómez">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Documento (TI / CC) *</label>
                                <input type="text" id="add-documento" required class="form-control form-control-sm" placeholder="Ej. TI 1045892302">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-muted">Curso / Grado *</label>
                                <select id="add-curso" required class="form-select form-select-sm">
                                    <option value="">-- Seleccionar --</option>
                                    <option value="Grado 6°">Grado 6°</option>
                                    <option value="Grado 7°">Grado 7°</option>
                                    <option value="Grado 8°">Grado 8°</option>
                                    <option value="Grado 9°">Grado 9°</option>
                                    <option value="Grado 10°">Grado 10°</option>
                                    <option value="Grado 11°">Grado 11°</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-muted">Edad *</label>
                                <input type="text" id="add-edad" required class="form-control form-control-sm" placeholder="Ej. 14 años">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-muted">Teléfono de Contacto *</label>
                                <input type="text" id="add-contacto" required class="form-control form-control-sm" placeholder="Ej. 3001234567">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Tutor Legal / Acudiente *</label>
                                <input type="text" id="add-acudiente" required class="form-control form-control-sm" placeholder="Ej. Marta Gómez">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Correo Electrónico</label>
                                <input type="email" id="add-correo" class="form-control form-control-sm" placeholder="Ej. estudiante@colegio.edu.co">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Alergias Conocidas</label>
                                <input type="text" id="add-alergias" class="form-control form-control-sm" placeholder="Ej. Penicilina, Polvo (o Ninguna)">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Enfermedades o Condición Médica</label>
                                <input type="text" id="add-enfermedades" class="form-control form-control-sm" placeholder="Ej. Asma, Rinitis (o Ninguna)">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-sm btn-samgy">
                            <i class="bi bi-check-lg me-1"></i>Guardar Estudiante
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
