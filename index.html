<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMGY - Sistema de Enfermería Escolar (Bootstrap UI)</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="d-flex" id="wrapper">
        <!-- SIDEBAR BOOTSTRAP -->
        <div id="sidebar-wrapper" class="border-end d-flex flex-column justify-content-between">
            <div>
                <div
                    class="sidebar-heading p-3 border-bottom border-secondary-subtle d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-2 overflow-hidden" style="max-width: 100%;">
                        <!-- LOGO CON DIMENSIONES AJUSTADAS Y CONTROLADAS -->
                        <img src="src/Logo.jpeg" alt="SAMGY Logo" class="img-fluid"
                            style="max-height: 40px; width: auto; object-fit: contain;">
                    </div>
                </div>

                <div class="p-3 bg-dark bg-opacity-50 text-white-50 small border-bottom border-secondary-subtle">
                    <i class="bi bi-building me-1 text-samgy-info"></i> Colegio San Alberto Magno
                </div>

                <div class="list-group list-group-flush my-3">
                    <button onclick="loadSection('inicio')" id="nav-inicio"
                        class="list-group-item list-group-item-action d-flex align-items-center">
                        <i class="bi bi-house-door-fill me-3 text-samgy-info"></i>Inicio
                    </button>
                    <button onclick="loadSection('estudiantes')" id="nav-estudiantes"
                        class="list-group-item list-group-item-action d-flex align-items-center">
                        <i class="bi bi-people-fill me-3 text-samgy-info"></i>Mis Estudiantes
                    </button>
                    <button onclick="loadSection('ficha')" id="nav-ficha"
                        class="list-group-item list-group-item-action d-flex align-items-center">
                        <i class="bi bi-file-earmark-person-fill me-3 text-samgy-info"></i>Ficha Médica
                    </button>
                    <button onclick="loadSection('atenciones')" id="nav-atenciones"
                        class="list-group-item list-group-item-action d-flex align-items-center">
                        <i class="bi bi-journal-check me-3 text-samgy-info"></i>Atenciones
                    </button>
                    <button onclick="loadSection('configuracion')" id="nav-configuracion"
                        class="list-group-item list-group-item-action d-flex align-items-center">
                        <i class="bi bi-gear-fill me-3 text-samgy-info"></i>Configuración
                    </button>
                </div>
            </div>

            <div class="mt-auto p-3 border-top border-secondary-subtle">
                <div class="d-flex align-items-center gap-2">
                    <div class="avatar-initials" style="width:36px; height:36px;">EN</div>
                    <div class="text-truncate">
                        <div class="fw-bold text-white small" id="sidebar-user-name">Lic. Enfermería</div>
                        <div class="text-white-50 extra-small">Enfermera Titular</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div id="page-content-wrapper" class="w-100 d-flex flex-column min-vh-100">
            <!-- Header Top Bar -->
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-3 shadow-sm">
                <div class="container-fluid p-0">
                    <div>
                        <h4 class="fw-bold font-title text-dark mb-0" id="page-title">Inicio</h4>
                        <span class="text-muted small">Plataforma Digital — SAMGY</span>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <button onclick="loadSection('atenciones')" class="btn btn-samgy btn-sm px-3 py-2">
                            <i class="bi bi-plus-lg me-1"></i>Nueva Atención
                        </button>
                        <span id="current-date-badge" class="badge bg-light text-dark border px-3 py-2"></span>
                    </div>
                </div>
            </nav>

            <!-- DYNAMIC CONTAINER -->
            <main id="main-dynamic-container" class="flex-grow-1 p-4 bg-light">
                <!-- Secciones dynamic -->
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
